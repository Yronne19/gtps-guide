<head>

<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1b2030;--mute:#5b6478;--line:#dfe3ee;--acc:#3b6cf6;--acc2:#e8eeff;--code:#f0f2f8;--ok:#15803d;--warn:#b45309;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c;--card:#181c28;--text:#e6e9f2;--mute:#9aa3b8;--line:#2a3042;--acc:#7da2ff;--acc2:#1f2a4a;--code:#222839;--ok:#4ade80;--warn:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131c;--card:#181c28;--text:#e6e9f2;--mute:#9aa3b8;--line:#2a3042;--acc:#7da2ff;--acc2:#1f2a4a;--code:#222839;--ok:#4ade80;--warn:#fbbf24;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:22px 18px 10px;max-width:1100px;margin:0 auto}
h1{margin:0;font-size:26px}h1 span{color:var(--acc)}
.sub{color:var(--mute);margin:4px 0 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 18px;border-bottom:1px solid var(--line)}
.bar-in{max-width:1100px;margin:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 13px;border-radius:999px;cursor:pointer;font:inherit}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tab small{opacity:.75;margin-left:4px}
input[type=search]{flex:1;min-width:180px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
main{max-width:1100px;margin:16px auto;padding:0 18px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h3{margin:0 0 4px;font:600 15px ui-monospace,Menlo,Consolas,monospace;color:var(--acc);word-break:break-all}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--acc2);color:var(--acc);margin-right:6px}
.mute{color:var(--mute);font-size:13px}
.desc{margin:8px 0}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{text-align:left;padding:4px 8px 4px 0;border-top:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--mute);font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
td:nth-child(2){font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
pre,code{font-family:ui-monospace,Menlo,Consolas,monospace}
pre{background:var(--code);padding:10px;border-radius:8px;overflow-x:auto;font-size:12.5px;margin:8px 0 0}
.sec{margin:22px 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin:2px 3px 0 0;font:12px ui-monospace,Menlo,Consolas,monospace;cursor:pointer;color:var(--acc)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.flow .n{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:13px ui-monospace,Menlo,Consolas,monospace}
.flow .a{color:var(--mute)}
.empty{color:var(--mute);padding:30px;text-align:center}
.val{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ok)}
.row{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:12px;margin-top:12px}
@media(max-width:760px){.row{grid-template-columns:1fr}}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.lane{position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 0 4px}
.node{width:42%;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.node b{display:block;margin-bottom:6px}
.line{position:absolute;left:21%;right:21%;top:36px;border-top:2px dashed var(--line)}
.dot{position:absolute;top:28px;width:16px;height:16px;border-radius:50%;background:var(--acc);left:calc(21% - 8px)}
.st{display:inline-block;font:11px ui-monospace,monospace;padding:1px 7px;margin:2px 2px 0 0;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.st.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.log{max-height:430px;overflow:auto}
.li{padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--card);font-size:13px}
.li.on{border-color:var(--acc);background:var(--acc2)}
.li.fut{opacity:.45}
textarea{width:100%;min-height:70px;background:var(--code);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:12.5px ui-monospace,Menlo,Consolas,monospace}
.hx{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;color:var(--ok)}
</style>
</head>

const EXAMPLE = `#include <enet/enet.h>
#include <stdio.h>

int main() {
    // 1) Init ENet (once)
    if (enet_initialize() != 0) return 1;

    // 2) Create a server host on port 1234, up to 32 clients, 2 channels
    ENetAddress addr;
    addr.host = ENET_HOST_ANY;      // listen on all interfaces
    addr.port = 1234;
    ENetHost *server = enet_host_create(&addr, 32, 2, 0, 0);

    // 3) Service loop: ask ENet what happened (wait up to 1000 ms)
    ENetEvent ev;
    while (enet_host_service(server, &ev, 1000) >= 0) {
        switch (ev.type) {
        case ENET_EVENT_TYPE_CONNECT:
            printf("client connected\\n");
            break;
        case ENET_EVENT_TYPE_RECEIVE:
            printf("got %zu bytes\\n", ev.packet->dataLength);
            enet_packet_destroy(ev.packet);   // you own received packets
            break;
        case ENET_EVENT_TYPE_DISCONNECT:
            printf("client left\\n");
            break;
        default: break;
        }
    }
    enet_host_destroy(server);
    enet_deinitialize();
}`;

["1. Hex text to bytes, and bytes back to a hex dump","Raw hex from a log is just text. Turn it into bytes first. Use the same to_hex() to print every packet your own server receives or sends.",`#include <cstdint>
#include <cstdio>
#include <cstring>
#include <sstream>
#include <string>
#include <vector>

// "04 00 00 00 03 ..."  ->  bytes   (tokens must be separated by spaces)
std::vector<uint8_t> from_hex(const std::string& s) {
    std::vector<uint8_t> out;
    std::istringstream in(s);
    std::string tok;
    while (in >> tok) out.push_back((uint8_t)std::stoul(tok, nullptr, 16));
    return out;
}

// bytes  ->  "04 00 00 00 ..."   (for logging)
std::string to_hex(const uint8_t* p, size_t n) {
    std::string s;
    char b[4];
    for (size_t i = 0; i < n; ++i) { std::snprintf(b, sizeof b, "%02x ", p[i]); s += b; }
    return s;
}`],
["2. Read the message type, then split text from game packets","Every ENet packet starts with a 4-byte little-endian message type. 2 and 3 are text lines (key|value). 4 is a 56-byte binary header (60 bytes with the message type) plus extra data.",`enum : uint32_t { SERVER_HELLO = 1, GENERIC_TEXT = 2, GAME_MESSAGE = 3, GAME_PACKET = 4 };

#pragma pack(push, 1)
struct GameHeader {                 // 56 bytes, sits right after the 4-byte message type
    uint8_t  type, objectType, jumpCount, buildRange;  // offset 0..3
    int32_t  netID;                 // 4   player in the world, or -1
    int32_t  targetNetID;           // 8
    int32_t  flags;                 // 12  0x08 = extra data follows
    float    float_var;             // 16
    int32_t  itemID;                // 20  18 = Fist, 32 = Wrench
    float    posX, posY;            // 24, 28  pixels (1 tile = 32)
    float    speedX, speedY;        // 32, 36
    float    particleID;            // 40
    int32_t  tileX, tileY;          // 44, 48
    uint32_t extraLen;              // 52  bytes after the header
};
#pragma pack(pop)
static_assert(sizeof(GameHeader) == 56, "header must be 56 bytes");

#include <map>
// "action|input\n|text|hello" -> {{"action","input"}, {"", ...}}  (first '|' splits key / value)
std::map<std::string, std::string> parse_text(const std::string& t) {
    std::map<std::string, std::string> kv;
    std::istringstream in(t);
    std::string line;
    while (std::getline(in, line)) {
        auto bar = line.find('|');
        if (bar != std::string::npos) kv[line.substr(0, bar)] = line.substr(bar + 1);
    }
    return kv;
}

void handle(const uint8_t* d, size_t n) {
    if (n < 4) return;
    uint32_t msg;
    std::memcpy(&msg, d, 4);                       // little-endian host assumed (x86 / ARM)
    if (msg == GENERIC_TEXT || msg == GAME_MESSAGE) {
        auto kv = parse_text(std::string((const char*)d + 4, n - 4));
        if (kv["action"] == "enter_game") { /* send the world menu */ }
    } else if (msg == GAME_PACKET && n >= 60) {
        GameHeader h;
        std::memcpy(&h, d + 4, sizeof h);           // memcpy is safe for unaligned data
        const uint8_t* extra = d + 60;
        size_t extraLen = n - 60;
        if (h.type == 0x03) { /* TILE_CHANGE_REQUEST: tile (h.tileX, h.tileY), item h.itemID */ }
        if (h.type == 0x01 && (h.flags & 0x08)) { /* CALL_FUNCTION: read variants from extra */ }
        (void)extra; (void)extraLen;
    }
}`],
["3. Read a variant list (CALL_FUNCTION extra data)","Layout: u8 count, then per entry: u8 index (0 = function name, 1.. = arguments), u8 type, data. Types: 1 float, 2 string (u32 length + bytes), 3 vec2, 4 vec3, 5 uint32, 9 int32.",`struct Variant { uint8_t idx, type; std::string s; float f[3]; int32_t i; };

std::vector<Variant> read_variants(const uint8_t* p, size_t n) {
    std::vector<Variant> out;
    if (n < 1) return out;
    size_t o = 1;                                   // p[0] = count
    for (int k = 0; k < p[0] && o + 2 <= n; ++k) {
        Variant v{};
        v.idx = p[o]; v.type = p[o + 1]; o += 2;
        if (o + 4 > n) return out;                  // every type needs at least 4 bytes
        switch (v.type) {
        case 2: {                                   // string
            uint32_t len;
            std::memcpy(&len, p + o, 4);
            if (o + 4 + len > n) return out;
            v.s.assign((const char*)p + o + 4, len);
            o += 4 + len; break;
        }
        case 1: std::memcpy(&v.f[0], p + o, 4); o += 4; break;       // float
        case 5: case 9: std::memcpy(&v.i, p + o, 4); o += 4; break;  // uint32 / int32
        case 3: if (o + 8 > n) return out;  std::memcpy(v.f, p + o, 8);  o += 8;  break;  // vec2
        case 4: if (o + 12 > n) return out; std::memcpy(v.f, p + o, 12); o += 12; break;  // vec3
        default: return out;                        // unknown type: stop
        }
        out.push_back(v);
    }
    return out;
}
// variants[0].s is the function name, e.g. "OnConsoleMessage"`],
["4. Build and send packets (what you do after decoding)","Decoding is only half of it. To answer, fill the same structures, then send the bytes on channel 0 with the RELIABLE flag.",`#include <enet/enet.h>

void send_bytes(ENetPeer* peer, const std::vector<uint8_t>& b) {
    ENetPacket* pkt = enet_packet_create(b.data(), b.size(), ENET_PACKET_FLAG_RELIABLE);
    enet_peer_send(peer, 0, pkt);                   // channel 0. ENet owns pkt after this
    std::printf("S>C %s\n", to_hex(b.data(), b.size()).c_str());   // log it for the Packet Tracker
}

// text message (msg = GENERIC_TEXT or GAME_MESSAGE)
void send_text(ENetPeer* peer, uint32_t msg, const std::string& text) {
    std::vector<uint8_t> b(4 + text.size());
    std::memcpy(b.data(), &msg, 4);
    std::memcpy(b.data() + 4, text.data(), text.size());
    send_bytes(peer, b);
}

// GAME_PACKET = 4-byte message type + 56-byte header + extra data
void send_game_packet(ENetPeer* peer, GameHeader h, const std::vector<uint8_t>& extra = {}) {
    if (!extra.empty()) h.flags |= 0x08;            // S_EXTENDED
    h.extraLen = (uint32_t)extra.size();
    std::vector<uint8_t> b(60 + extra.size());
    uint32_t msg = GAME_PACKET;
    std::memcpy(b.data(), &msg, 4);
    std::memcpy(b.data() + 4, &h, sizeof h);
    if (!extra.empty()) std::memcpy(b.data() + 60, extra.data(), extra.size());
    send_bytes(peer, b);
}

// CALL_FUNCTION: OnConsoleMessage("hello")
void send_console(ENetPeer* peer, const std::string& text) {
    std::vector<uint8_t> v;
    auto put_str = [&](uint8_t idx, const std::string& s) {
        v.push_back(idx); v.push_back(2);           // index, type 2 = string
        uint32_t len = (uint32_t)s.size();
        v.insert(v.end(), (uint8_t*)&len, (uint8_t*)&len + 4);
        v.insert(v.end(), s.begin(), s.end());
    };
    v.push_back(2);                                 // variant count
    put_str(0, "OnConsoleMessage");                 // 0 = function name
    put_str(1, text);                               // 1.. = arguments
    GameHeader h{};
    h.type = 0x01; h.netID = -1;
    send_game_packet(peer, h, v);
}`],

while (enet_host_service(host, &ev, 16) >= 0) {

}`],
